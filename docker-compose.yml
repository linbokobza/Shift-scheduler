version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: shift-scheduler-mongodb
    restart: unless-stopped
    # Do NOT expose MongoDB port to the host in production
    # ports:
    #   - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}
      MONGO_INITDB_DATABASE: shift-scheduler
    volumes:
      - mongodb_data:/data/db
    networks:
      - shift-scheduler-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shift-scheduler-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5176}
      LOG_LEVEL: info
    depends_on:
      - mongodb
    networks:
      - shift-scheduler-network
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  # Frontend (React + Vite)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: shift-scheduler-frontend
    restart: unless-stopped
    ports:
      - "5176:5176"
    environment:
      VITE_API_URL: http://localhost:5001/api
    depends_on:
      - backend
    networks:
      - shift-scheduler-network
    volumes:
      - ./src:/app/src
      - /app/node_modules
    command: npm run dev -- --host

networks:
  shift-scheduler-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
